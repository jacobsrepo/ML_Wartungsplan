[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-wartungsplan"
version = "0.1.0"
description = "SAP maintenance-plan strategy and realistic Eckende recommendation system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "holidays>=0.60,<1",
    "jinja2>=3.1,<4",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "scikit-learn==1.9.0",
    "uvicorn[standard]>=0.30,<1",
    "python-calamine",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<7",
    "nbformat>=5.10,<6",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_wartungsplan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
